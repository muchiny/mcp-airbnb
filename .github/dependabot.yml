# Keeps Cargo.lock and the SHA-pinned GitHub Actions current (audit SEC-8, CI-2).
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # rmcp 2.x/3.x change the server API; migrating off 1.x is its own project.
      - dependency-name: "rmcp"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
