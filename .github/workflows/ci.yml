name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Hardened lints (rust-hardening.md): counted by `hardening`, imported into
  # SonarCloud by `sonar`. One list, so the two jobs cannot drift apart.
  HARDENING_LINTS: >-
    -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic -W clippy::todo
    -W clippy::unimplemented -W clippy::indexing_slicing -W clippy::arithmetic_side_effects
    -W clippy::as_conversions

# Actions are pinned to full commit SHAs (audit CI-2). Dependabot
# (.github/dependabot.yml) proposes SHA bumps; scripts/check_workflows.py
# enforces the pinning rules in the `workflow-hygiene` job below.
# The toolchain comes from rust-toolchain.toml (1.93 = MSRV, audit CI-1).
# Runner images are pinned too (ubuntu-24.04, not ubuntu-latest): moving to a
# new OS release is a reviewed commit, not a silent label migration.
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Early warning for lints added by newer stable releases. It never blocks
  # a merge: the blocking gate is the MSRV clippy job above.
  clippy-latest:
    name: Clippy (latest stable, advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +stable clippy --locked --all-targets -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-tarpaulin@0.37.4
      - run: cargo tarpaulin --config tarpaulin.toml --out xml --skip-clean
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cobertura.xml
          fail_ci_if_error: false
      - name: Keep cobertura.xml for the sonar job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 1

  # SonarQube Cloud (CI-based analysis: Automatic Analysis skips Rust). Imports
  # the tarpaulin coverage and a Clippy report; settings in
  # sonar-project.properties. Dependabot and fork PRs get no SONAR_TOKEN, so
  # the job is skipped for them.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    needs: coverage
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    env:
      # The report must list every warning instead of stopping at the first
      # one; blocking on lints stays the job of `clippy`.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: Sonar needs blame data to tell new code from old.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-cobertura
      - name: Clippy report (JSON)
        run: |
          # shellcheck disable=SC2086 # HARDENING_LINTS is a list of flags
          cargo clippy --locked --message-format=json -- $HARDENING_LINTS > clippy-report.json
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  hardening:
    # Informatif : compte les violations des lints durcis (rust-hardening.md) et
    # vérifie la baseline cargo-vet. Ne bloque jamais ; à rendre bloquant
    # quand les compteurs sont à zéro.
    name: Hardening (informatif)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.93"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-vet@0.10.2
      - name: Lints durcis (comptage)
        run: |
          # shellcheck disable=SC2086 # HARDENING_LINTS is a list of flags
          cargo clippy --locked --message-format=short -- $HARDENING_LINTS 2> hardening.txt || true
          {
            echo '### Lints durcis (non bloquant)'
            echo '```'
            sed -nE 's/^[^ ]+ (warning|error): //p' hardening.txt | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo vet (baseline d'exemptions)
        run: cargo vet --locked

  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_workflows.py

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      # Fuzzing looks for crashes, not lints: do not let a new nightly
      # warning fail the job. cargo-fuzz appends its sanitizer flags.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # rust-toolchain.toml pins 1.93 for the repository, so every cargo
      # call in this job names the nightly toolchain explicitly.
      - run: cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Run fuzz targets (committed seeds + dictionary, 120 s each)
        run: |
          set -uo pipefail
          FUZZ_TARGETS=(
            fuzz_search_parser
            fuzz_detail_parser
            fuzz_calendar_parser
            fuzz_review_parser
            fuzz_graphql_search
            fuzz_graphql_detail
            fuzz_graphql_review
            fuzz_graphql_host
            fuzz_host_profile_html
            fuzz_api_key
            fuzz_calendar_analytics
            fuzz_calendar_model
            fuzz_input_validation
          )
          status=0
          for target in "${FUZZ_TARGETS[@]}"; do
            echo "::group::Fuzzing $target"
            mkdir -p "$GITHUB_WORKSPACE/fuzz/corpus/$target"
            if ! cargo +nightly fuzz run "$target" \
                "$GITHUB_WORKSPACE/fuzz/corpus/$target" "$GITHUB_WORKSPACE/fuzz/seeds/$target" -- \
                -dict="$GITHUB_WORKSPACE/fuzz/airbnb.dict" -max_total_time=120 -max_len=131072 -timeout=10; then
              echo "::error title=fuzz::$target found a crash; the reproducer is in the fuzz-artifacts upload"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
