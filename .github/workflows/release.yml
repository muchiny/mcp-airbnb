name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; only the final `release` job may write
# (audit CI-2). Actions are pinned to full commit SHAs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag never publishes binaries that fail the CI gate.
  verify:
    name: Verify (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux aarch64 — native GitHub-hosted ARM runner (replaces `cross`
          # built from git HEAD, audit CI-2)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # macOS Intel — cross-compile from ARM runner
          - target: x86_64-apple-darwin
            os: macos-latest
          # macOS Apple Silicon — native on ARM runner
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows x86_64 — native
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.93"
          targets: ${{ matrix.target }}

      # rust-toolchain.toml selects 1.93; make sure the target is installed
      # for that exact toolchain.
      - name: Add compilation target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mcp-airbnb-${{ matrix.target }}.tar.gz mcp-airbnb airbnb
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mcp-airbnb-${{ matrix.target }}.zip mcp-airbnb.exe airbnb.exe
          cd ../../..

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-airbnb-${{ matrix.target }}
          path: mcp-airbnb-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA-256 checksums
        run: |
          cd artifacts
          sha256sum mcp-airbnb-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
