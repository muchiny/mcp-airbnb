[package]
name = "mcp-airbnb"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "MCP server for searching and browsing Airbnb listings"
license = "MIT"
default-run = "mcp-airbnb"

[[bin]]
name = "mcp-airbnb"
path = "src/main.rs"

[[bin]]
name = "airbnb"
path = "src/bin/cli.rs"

[dependencies]
# MCP Protocol — official Rust SDK
rmcp = { version = "1.4.0", features = ["server", "macros", "transport-io", "schemars"] }

# Async runtime
tokio = { version = "1.51.1", features = ["rt-multi-thread", "io-util", "io-std", "macros", "sync", "time"] }
async-trait = "0.1.89"

# HTTP client for web scraping
reqwest = { version = "0.13.2", features = ["json", "cookies"] }

# HTML parsing (CSS selectors)
scraper = "0.26.0"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Pure-Rust YAML 1.2 (forbid(unsafe_code)); replaces the unsound, archived
# serde_yml/libyml (RUSTSEC-2025-0068/0067). Production only deserializes.
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
schemars = "1.2.1"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.103"

# Logging (stderr only — stdout is reserved for MCP JSON-RPC)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Cache
# 0.18.2+ fixes RUSTSEC-2026-0253 (pop() panic safety); 0.16.4 does not.
lru = "0.18.5"

# CLI
clap = { version = "4.6.0", features = ["derive", "env"] }

# Utils
chrono = { version = "0.4.43", features = ["serde"] }
url = "2.5.8"
base64 = "0.23.1"
percent-encoding = "2.3.2"

[dev-dependencies]
rmcp = { version = "1.4.0", features = ["server", "client", "macros", "transport-io", "schemars"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "test-util"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize", "serialize"] }
wiremock = "0.6.5"
tempfile = "3.27.0"
insta = { version = "1.47.2", features = ["json"] }
pretty_assertions = "1.4.1"
proptest = "1.11.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
format_push_string = "allow"
