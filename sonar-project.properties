# SonarQube Cloud, analysed by the `sonar` job of .github/workflows/ci.yml.
# SonarCloud's Automatic Analysis skips Rust: keep it disabled
# (Administration > Analysis Method), the two analysis methods conflict.
sonar.organization=muchiny
sonar.projectKey=muchiny_mcp-airbnb
sonar.projectName=mcp-airbnb
sonar.sourceEncoding=UTF-8

# Scope. Main code: the crate, the fuzz targets, the Python scripts and the
# workflows (GitHub Actions rules). Out of scope: .specify/ (generated
# spec-kit tooling), specs/, docs/, claude-resources/.
sonar.sources=src,fuzz/fuzz_targets,fuzz/make_seeds.py,scripts,.github
sonar.tests=tests,scripts/test_live_smoke.py
# A file is either main code or test code, never both.
sonar.exclusions=scripts/test_*.py
# Anonymized fixtures are data, not code.
sonar.test.exclusions=tests/fixtures/**

# Coverage: cobertura.xml comes from cargo tarpaulin (`coverage` job). The
# Python scripts, fuzz targets and workflows have no coverage report: without
# this exclusion they would count as 0 % and fail the quality gate.
sonar.rust.cobertura.reportPaths=cobertura.xml
sonar.coverage.exclusions=scripts/**,fuzz/**,.github/**

# Clippy issues (default lints + hardened lints), written by the `sonar` job.
sonar.rust.clippyReport.reportPaths=clippy-report.json
